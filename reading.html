<!DOCTYPE html>
<html lang="ko">
<head>

<body>
    <header>
        <img class="profile" src="프로필사진.jpg" alt="김준연 프로필 사진">

        <p>제가 좋아하는 취미인 독서를 소개합니다.</p>

    <main>
        <section class="card">
            <h2>독서를 좋아하는 이유</h2>
            <p>
                책을 통해 새로운 지식과 다양한 생각을 배울 수 있어서 좋아합니다.
                조용한 시간에 집중하면서 스스로를 성장시킬 수 있는 취미입니다.
            </p>
        </section>

        <section class="card">
            <h2>독서의 매력</h2>
            <p>
                책마다 다른 이야기와 정보를 만날 수 있다는 점이 매력적입니다.
                읽을수록 시야가 넓어지고 새로운 관점을 얻을 수 있습니다.
            </p>
        </section>

        <section class="card">
            <h2>돌아가기</h2>
